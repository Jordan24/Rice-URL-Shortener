<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Redirecting | Rice University Link Shortener</title>
  <meta name="theme-color" content="#00205B">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #00205B;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 1.5rem;
      border: 3px solid rgba(0, 32, 91, 0.15);
      border-top-color: #00205B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.9rem;
      color: #7C7E7F;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1 id="status-title">Redirecting...</h1>
    <p id="status-desc">Connecting to Rice University destination.</p>
  </div>

  <script>
    (function () {
      const DEFAULT_FALLBACK = "https://rice.edu";
      const RESERVED_ROUTES = ["app", "dashboard", "login", "admin", "static", "r"];
      
      // Parse short code from pathname
      const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
      const segments = path.split("/");
      const code = (segments[0] || "").toLowerCase().trim();

      // If root or empty
      if (!code) {
        window.location.replace("/");
        return;
      }

      // Check if this is an SPA route for the Flutter dashboard
      if (RESERVED_ROUTES.includes(code)) {
        // Store path for SPA router restoration and redirect to index
        sessionStorage.setItem("spa_redirect", window.location.href);
        window.location.replace("/");
        return;
      }

      // Short link redirection is handled at the edge by AWS CloudFront -> ALB -> Serverpod.
      // If static fallback 404.html is reached directly, hand over to Flutter SPA NotFoundView.
      sessionStorage.setItem("spa_redirect", window.location.href);
      window.location.replace("/");
    })();
  </script>
</body>
</html>
